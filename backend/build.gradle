plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	/* 웹 */
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	// 채팅(API-077): STOMP 없이 노션의 JSON 프레임 계약을 그대로 주고받는 WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	/* 보안: 소셜 ID 토큰 검증과 서비스 JWT 발급·검증 모두 리소스 서버 + jose 로 처리한다 */
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	/* 데이터 */
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	// Redis: 멱등키·업로드 세션 등 짧게 보관하는 값 (global.idempotency)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	/* 암호화: 여행방 초대 토큰을 결정적 암호화(AES-SIV)로 저장해 조회·재표시에 함께 쓴다 */
	implementation 'com.google.crypto.tink:tink:1.15.0'

	/* 파일: S3 Presigned URL 발급·조건부 복사(API-012·086·013). 대안이 없어 AWS SDK v2 를 쓴다 */
	implementation platform('software.amazon.awssdk:bom:2.57.10')
	implementation 'software.amazon.awssdk:s3'

	/* 사진 EXIF: 통합 기록 초안(API-064)이 기록 사진의 촬영 시각·GPS 를 읽는다. Apache 2.0, xmpcore 하나만 딸려 온다 */
	implementation 'com.drewnoakes:metadata-extractor:2.22.0'

	/* 푸시: 채팅 앱 알림(노션 API-077)을 FCM HTTP v1 로 보낸다. 쓰지 않는 Firestore·Storage 는 뺀다 */
	implementation('com.google.firebase:firebase-admin:9.11.0') {
		exclude group: 'com.google.cloud', module: 'google-cloud-firestore'
		exclude group: 'com.google.cloud', module: 'google-cloud-storage'
	}

	/* Lombok */
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	/* 테스트 */
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// Boot 4 에서 @WebMvcTest MockMvc 에 시큐리티 필터를 붙이는 자동 설정이 이 모듈로 분리됐다.
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	// 테스트는 PostgreSQL 없이 돌도록 H2(PostgreSQL 모드)를 쓴다.
	testRuntimeOnly 'com.h2database:h2'
	// Redis 를 쓰는 테스트는 Testcontainers 로 실제 Redis 를 띄운다(로컬·GitHub Actions 모두 Docker 필요).
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		exceptionFormat = 'full'
	}
}
