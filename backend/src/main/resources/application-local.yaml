spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yeogirok}
    username: ${DB_USERNAME:yeogirok}
    password: ${DB_PASSWORD:yeogirok}
  data:
    redis:
      # infra/docker-compose.local.yml 의 redis 와 같다(비밀번호 없음).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

yeogirok:
  # API-046 방문 분포. 로컬 실행용 제안값이다(11/4). 실제 값은 팀이 정해 prod 환경 변수로 넣는다.
  # 기본 셀 크기를 바꾸면 aggregation-version 도 바꾼다(VisitStatisticsProperties 참고).
  visit-statistics:
    aggregation-version: grid-0.005-v1
    base-cell-size-degrees: 0.005
    zoom-multipliers: "15:1,13:2,11:8,9:32,0:128"
    min-count: 1
  idempotency:
    # 멱등키 보관 기간(11/3 결정, 요청 종류와 상관없이 같다)과 처리 중 표시 수명(제안값).
    retention: ${IDEMPOTENCY_RETENTION:24h}
    processing-timeout: ${IDEMPOTENCY_PROCESSING_TIMEOUT:30s}
