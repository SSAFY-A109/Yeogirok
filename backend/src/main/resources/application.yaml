spring:
  application:
    name: yeogirok
  profiles:
    default: local
  # backend/.env 가 있으면 환경 변수처럼 읽는다(.env.example 참고). 없으면 OS 환경 변수만 쓴다.
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway 가 만든다(db/migration, docs/08-flyway.md). local·prod 프로필은 엔티티와 맞는지만 확인한다(validate).
      ddl-auto: none
  task:
    execution:
      shutdown:
        # 배포·재시작 때 진행 중인 비동기 작업(팁 게시·수정)이 끝날 때까지 기다린다. 넘기면 StuckTipRecoveryJob 이 정리한다.
        await-termination: true
        await-termination-period: 30s

yeogirok:
  footprint:
    # API-041 작성 제한(11/4 팀 결정): 같은 날(Asia/Seoul 04:00 기준) 이미 남긴 내 발자취와 이 거리 이내면 거부(F003).
    same-day-radius-meters: 500
  job:
    # 비동기 작업(API-011) 기록 보관 기간·대기 제한·실행 제한·실행 스레드 수. 정해진 값이 없어 제안값이다(backend/docs/06-schedule.md).
    # 대기 제한 안에 시작하지 못한 작업은 실행하지 않고 실패로 끝낸다. 실행 제한은 시작한 때부터 센다.
    retention: 24h
    queue-timeout: 10m
    run-timeout: 2m
    threads: 2
  schedule:
    # 일정 초안(API-037~039·084) 보관 기간. 정해진 값이 없어 제안값이다(backend/docs/06-schedule.md).
    draft-retention: 24h
  record:
    # 통합 기록 초안(API-064·065) 보관 기간. 노션 제안값이다(팀 미확정).
    draft-retention: 24h
    # 기록에 연결한 영수증 자료(정제 값)를 원본 삭제 뒤 두는 기간(11/10 결정). 연결 안 된 자료는 멱등키 보관 기간(24h).
    material-retention: 30d
    draft:
      # 사진을 영수증 항목 근거로 붙이는 기준(결제 시각 앞뒤, 사진 GPS 와 영수증 장소 거리)과
      # 남은 사진을 묶는 기준(앞 사진과의 시간 차·거리). 제안값이다(specs/record-api-2.md 5절 14).
      receipt-photo-window: 60m
      receipt-photo-max-meters: 1000
      photo-group-gap: 60m
      photo-group-max-meters: 500
  visit-statistics:
    # API-046 한 번에 조회할 수 있는 최대 셀 수. 넘으면 C013.
    max-cells: 2500
  tip:
    # AR 팁 거리·개수(11/6 확정): 주변 탐색 50m, 상세·반응 5m(경계 포함), 탐색 결과 가까운 순 최대 10개.
    search-radius-meters: 50
    interaction-radius-meters: 5
    max-search-results: 10
    # placement JSON 최대 크기(11/8 결정 8KB). 앱은 3개 필드만 보낸다.
    placement-max-bytes: 8192
    # 게시 작업이 끊겨 REGISTERING 에 남은 팁을 FAILED 로 돌리는 주기와 기준 시간(PR #64 리뷰 제안 5분).
    stuck-check-interval: PT5M
    stuck-registering-timeout: PT5M
  room:
    invite:
      # 초대 토큰 암호화 키(AES-SIV). Base64, 디코드했을 때 64바이트. 환경 변수로만 넣는다. 이 파일·Git 에 쓰지 않는다.
      # 생성(한 줄로): openssl rand -base64 -A 64
      token-key: ${ROOM_INVITE_TOKEN_KEY}
      # inviteUrl 앞부분. 앱 딥링크 주소가 정해지면 바꾼다.
      url-base: ${ROOM_INVITE_URL_BASE}
  file:
    # Presigned URL 수명(11/3 결정). 업로드 URL 수명은 미완료 업로드 세션의 만료 시각이기도 하다.
    upload-url-ttl: 10m
    download-url-ttl: 15m
    # 영수증 원본 최대 보관 기간(노션 API-012). 최초 발급 시각부터 세고 재전송·완료·보정으로 늘리지 않는다.
    receipt-retention: 24h
    # 파일당 최대 크기(노션 API-012). 같은 크기는 허용한다. 1MB = 1,048,576바이트(앱과 같은 기준, 11/6 결정).
    max-size:
      TIP_PHOTO: 20MB
      RECORD_PHOTO: 20MB
      RECEIPT: 10MB
    # 정리 주기(11/6 결정). 기한 목록은 자주, Redis 유실 대비 버킷 스캔은 드물게 돈다.
    # safety-scan-interval 은 팁에 연결되지 않은 사진 정리(TipPhotoCleanupJob, 11/9)도 같이 쓴다.
    cleanup:
      due-interval: PT10M
      safety-scan-interval: PT1H
  ocr:
    # 영수증 OCR 서버(ai/ocr). 서버는 compose 내부 주소 http://ai:8000. 비어 있으면 앱은 뜨고 OCR 작업만 실패한다(C014).
    base-url: ${OCR_BASE_URL:}
    connect-timeout: 2s
    # 11/9 노트북(22코어) 시험에서 긴 변 1600 제한 시 2.4초. 서버 실측 뒤 가장 느린 경우의 2배로 조정.
    # 차례 대기 + 호출이 작업 실행 제한(yeogirok.job.run-timeout 2m) 안에 들어와야 한다.
    read-timeout: 20s
    # OCR 은 한 번에 한 건만 부른다. 앞 건을 기다리는 최대 시간(응답 제한과 따로).
    slot-wait: 30s
  # 채팅(11/10 결정). 앱은 25초마다 PING 을 보낸다. Nginx proxy_read_timeout 은 idle-timeout 보다 길게 둔다.
  chat:
    ticket-ttl: PT30S
    auth-timeout: PT10S
    idle-timeout: PT60S
    sweep-interval: PT5S
    # 방 삭제 뒤 메시지 정리. 정리 목록(Redis)은 10분, Redis 유실 대비 DB 스캔은 1시간마다(파일 정리 주기와 같다).
    cleanup:
      due-interval: PT10M
      safety-scan-interval: PT1H
      batch-size: 500
    # 앱 푸시(노션 API-077 채팅 푸시). 같은 수신자·같은 방은 3초에 한 번, 본문은 메시지 앞 40자.
    # 접속 기록 수명은 무응답 기준(idle-timeout 60초)보다 길게 둔다. 연결이 닫히면 바로 지우므로 서버가 죽었을 때만 쓰인다.
    push:
      presence-ttl: PT90S
      throttle: PT3S
      preview-length: 40
      threads: 2
      queue-capacity: 1000
  push:
    fcm:
      # Firebase 서비스 계정 키 JSON 파일 전체를 Base64 한 줄로 넣는다. 환경 변수로만 넣는다. 이 파일·Git 에 쓰지 않는다.
      # 앱 푸시 전체(채팅 등)가 이 키를 쓴다. 비어 있으면 푸시를 보내지 않고 앱은 그대로 뜬다(로컬·테스트).
      # 만들기(한 줄로): base64 -w0 서비스계정.json   또는 openssl base64 -A -in 서비스계정.json
      service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
      connect-timeout: 5s
      read-timeout: 10s
  kakao:
    local:
      # 역지오코딩(API-041 주소 표시, API-031 후보 법정동). 키가 없으면 해당 값을 null 로 저장하고 앱은 그대로 뜬다.
      # 키는 환경 변수로만 넣는다. 이 파일·Git 에 쓰지 않는다.
      rest-api-key: ${KAKAO_REST_API_KEY:}
      base-url: https://dapi.kakao.com
      # 멱등키 처리 중 표시 수명(30s)보다 충분히 짧게 둔다.
      connect-timeout: 2s
      read-timeout: 3s
    mobility:
      # 자동차 길찾기(일정 이동 시간). 키·제한 시간은 위 local 값을 같이 쓴다. 대중교통·도보는 local base-url(dapi)로 부른다.
      base-url: https://apis-navi.kakaomobility.com
auth:
  jwt:
    issuer: yeogirok
    secret: ${JWT_SECRET}
    # TBD: 토큰 수명은 팀 결정 전이다(04-auth-api.md §6). 30분 / 14일은 제안값.
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  oidc:
    google:
      allowed-audiences:
        - ${GOOGLE_WEB_CLIENT_ID}
    kakao:
      allowed-audiences:
        - ${KAKAO_APP_KEY}
  unlink:
    # 탈퇴 시 카카오 연결 끊기에 쓴다. 비어 있으면 해제하지 않고 재시도 대상으로 남긴다(로컬 개발용).
    kakao-admin-key: ${KAKAO_ADMIN_KEY:}
    kakao-api-base-url: https://kapi.kakao.com
    # 구글 회원 탈퇴 때 앱이 보낸 serverAuthCode 를 토큰으로 바꿔 연결을 해제한다. 시크릿이 비어 있으면 구글 회원은 탈퇴할 수 없다.
    google-client-id: ${GOOGLE_WEB_CLIENT_ID}
    google-client-secret: ${GOOGLE_WEB_CLIENT_SECRET:}
    google-oauth-base-url: https://oauth2.googleapis.com
    # 실패한 카카오 연결 해제를 1시간마다 24회(약 하루) 다시 시도한다. 연결 해제는 급하지 않아 천천히 오래 시도한다.
    retry-interval: PT1H
    max-attempts: 24
  withdrawal:
    # TBD: 탈퇴 전 재인증 허용 시간. 소셜 로그인 후 이 시간이 지나면 A011. 5분은 제안값.
    reauth-max-age: PT5M

springdoc:
  swagger-ui:
    path: /swagger-ui.html
