# 앱 실행 스모크 — 템플릿. 로그인 화면 testID가 생기면 그 값으로 바꾼다.
# 실행: MAESTRO_APP_ID=<번들 id> maestro test .maestro/flows/00-app-launch.yaml
#      (Maestro는 MAESTRO_ 로 시작하는 환경 변수를 flow에서 읽는다. -e MAESTRO_APP_ID=… 도 같다)
# 빌드: __DEV__ === true인 개발 빌드(전체 API는 MSW로 처리)
appId: ${MAESTRO_APP_ID}
name: 00 앱 실행
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible:
    id: "login.screen"
