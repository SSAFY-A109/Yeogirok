# 앱 실행 → MSW 개발 로그인 → 메인. 실제 소셜 SDK 인증은 포함하지 않는다.
# 실행: MAESTRO_APP_ID=<번들 id> maestro test .maestro/flows/00-app-launch.yaml
#      (Maestro는 MAESTRO_ 로 시작하는 환경 변수를 flow에서 읽는다. -e MAESTRO_APP_ID=… 도 같다)
# 빌드: __DEV__ === true인 개발 빌드(전체 API는 MSW로 처리)
appId: ${MAESTRO_APP_ID}
name: 00 앱 실행
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible:
    id: "login.screen"
- assertVisible:
    id: "login.kakao"
- assertVisible:
    id: "login.google"
- assertNotVisible:
    id: "tabs.ar-tip"
- tapOn:
    id: "login.kakao"
- assertVisible:
    id: "home.screen"
- assertVisible:
    id: "tabs.ar-tip"
- assertNotVisible:
    id: "login.screen"
