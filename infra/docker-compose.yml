# 서버용 Compose. 서버의 ~/yeogirok/infra-src/infra 에서 실행한다.
#
#   docker compose up -d --build     # 전체 켜기 (처음 한 번)
#   docker compose ps                # 상태 보기
#   docker compose logs -f backend   # 백엔드 로그 보기
#
# 값은 같은 폴더의 .env 에서 읽는다(.env.example 참고, 커밋 금지).
#
# 포트는 모두 127.0.0.1 에만 연다. Docker는 방화벽(ufw) 규칙을 건너뛰고 포트를 열기 때문에,
# "5432:5432"처럼 쓰면 DB가 인터넷에 그대로 노출된다. 바깥에서 들어오는 길은 Nginx(80·443) 하나뿐이다.
# Redis는 백엔드만 쓰므로 포트를 아예 열지 않고 compose 내부망(redis:6379)으로만 붙는다.

name: yeogirok

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 서버 안에서만 접속 가능 (SSH 터널로 조회할 때 사용)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine   # 로컬 compose와 같은 버전
    restart: unless-stopped
    # 멱등키·로그인 세션 용도라 다음처럼 둔다 (가이드 9단계 Redis).
    # - 비밀번호를 건다. .env 에 REDIS_PASSWORD 가 없으면 비밀번호 없이 뜨지 않도록 compose 가 바로 멈춘다(:?).
    # - 디스크에 기록해(appendonly) 재시작·배포 뒤에도 키가 남는다.
    # - 메모리는 256MB까지 쓰고, 꽉 차면 키를 지우지 않고 쓰기를 거부한다(noeviction).
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 넣어야 한다 (가이드 9단계 Redis)}"
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      # 컨테이너 안의 redis-cli 가 비밀번호를 따로 치지 않고 접속한다 (헬스체크·점검용).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - redis-data:/data
    healthcheck:
      # 종료 코드가 아니라 PONG 이 왔는지로 판단한다. 비밀번호 오류(NOAUTH)를 정상으로 보지 않기 위해서다.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # 서버에 따로 받아 둔 backend/dev 코드로 이미지를 만든다 (가이드 3단계 폴더 구조).
    build:
      context: ../../backend-src/backend
      # 이미지를 만든 커밋을 표시해 둔다. deploy-backend.sh 가 넘기고, 되돌릴 때 어느 버전인지 알리는 데 쓴다.
      # 지금 떠 있는 버전 보기: docker inspect -f '{{index .Config.Labels "yeogirok.commit"}}' yeogirok-backend:latest
      labels:
        yeogirok.commit: ${BACKEND_COMMIT:-unknown}
    image: yeogirok-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # DB가 준비된 뒤에 백엔드를 띄운다
      redis:
        condition: service_healthy   # Redis도 준비된 뒤에 띄운다
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      # Redis (prod 프로필은 기본값이 없어 하나라도 빠지면 백엔드가 바로 멈춘다)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 멱등키 보관 기간(11/3 결정)과 처리 중 표시 수명(백엔드 제안값). 비밀 값이 아니라 여기에 바로 적는다.
      IDEMPOTENCY_RETENTION: 24h
      IDEMPOTENCY_PROCESSING_TIMEOUT: 30s
      # S3 파일 저장소 (값은 .env)
      AWS_REGION: ${AWS_REGION}
      S3_PHOTO_BUCKET: ${S3_PHOTO_BUCKET}
      S3_RECEIPT_BUCKET: ${S3_RECEIPT_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # 로그인 (값은 .env, 백엔드 backend/docs/05-social-login-setup.md 참고). 하나라도 비면 백엔드가 바로 멈춘다.
      # 구글 웹 클라이언트 ID와 카카오 네이티브 앱 키는 앱(프론트)과 같은 값이다.
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      KAKAO_APP_KEY: ${KAKAO_APP_KEY}
      # 선택 키 (값은 .env). 비어 있어도 백엔드는 뜨고, 아래 기능만 동작하지 않는다.
      # - GOOGLE_WEB_CLIENT_SECRET: 구글 회원 탈퇴 때 구글 연결 해제. 없으면 구글 회원은 탈퇴할 수 없다.
      # - KAKAO_ADMIN_KEY: 카카오 회원 탈퇴 때 카카오 연결 해제. 없으면 해제하지 않고 재시도 대상으로만 남는다.
      # - KAKAO_REST_API_KEY: 발자취 주소·후보 장소 법정동(카카오 로컬 API). 없으면 주소가 비어 저장된다.
      # - FIREBASE_SERVICE_ACCOUNT_BASE64: 채팅 앱 푸시(FCM). 없으면 푸시만 보내지 않는다.
      # :- 는 .env 에 없을 때 경고 없이 빈 값으로 넘긴다는 뜻이다.
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
      # 여행방 초대 (백엔드 #55, 11/6). 둘 중 하나라도 빠지면 백엔드가 바로 멈춘다.
      # 초대 토큰 암호화 키는 비밀 값이라 .env 에 둔다. 한 번 만든 뒤에는 바꾸지 않는다.
      ROOM_INVITE_TOKEN_KEY: ${ROOM_INVITE_TOKEN_KEY}
      # 초대 링크 앞부분(뒤에 /{초대 토큰}이 붙는다). 비밀 값이 아니라 여기에 바로 적는다.
      # TBD: 앱 딥링크 주소가 정해지면 바꾼다. 지금 앱은 이 링크를 복사·공유만 하고, 눌렀을 때 열리는 화면은 없다.
      ROOM_INVITE_URL_BASE: https://k15a109.p.ssafy.io/invite
      # 초대 링크를 앱으로 여는 Android App Links(백엔드 /.well-known/assetlinks.json). 앱 서명 인증서 SHA-256 지문을 쉼표로 잇는다.
      # 비밀 값이 아니라 여기에 바로 적는다. 여기 없는 키로 서명한 앱에서는 초대 링크가 앱이 아니라 브라우저로 열린다.
      # 첫째는 Expo 템플릿 debug.keystore(개발 빌드), 둘째는 배포 키(yeogirok-release.p12, alias yeogirok) 지문이다.
      # 값을 통째로 바꾸므로 백엔드 기본값(debug 지문)도 여기에 같이 적어야 한다. 빈 값으로 넘기면 모든 앱에서 링크가 안 열린다.
      ANDROID_APP_SHA256_FINGERPRINTS: "FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C,80:91:94:BA:C4:9D:FD:C0:3D:B6:D1:66:3D:03:EB:49:62:26:B2:94:E9:F1:EC:65:C7:C6:F6:BA:FF:F3:D7:F1"
      # 방문 분포(API-046)와 현재 위치 증거(DEC-01). 비밀 값이 아니라 여기에 바로 적는다. 하나라도 빠지면 백엔드가 바로 멈춘다.
      # TBD: 위치 증거 값(LOCATION_*)은 팀이 아직 정하지 않아 백엔드 로컬 제안값(11/4, application-local.yaml)을 임시로 넣었다.
      # 셀 크기를 바꾸면 VISIT_STATS_AGGREGATION_VERSION 도, 위치 기준을 바꾸면 LOCATION_POLICY_VERSION 도 함께 바꾼다.
      #
      # 방문 분포 격자(11/12, 백엔드와 공유): 지도를 가장 가까이 당겼을 때(카카오 지도 20m 기준, zoom 19) 발자취가 남긴 자리에
      # 찍히도록 기본 셀을 0.0001도(약 11m x 9m)로 두고, 멀리 볼수록 "최소zoom:배수"로 셀을 키운다. 마커는 셀 중심에 찍힌다.
      #   zoom 19 -> 0.0001도(약 11m)   18 -> 0.0002도   17 -> 0.0005도   16 -> 0.001도(약 110m)
      #   zoom 15 -> 0.005도(약 550m)   13 -> 0.01도     11 -> 0.04도     9 -> 0.16도     그 아래 -> 0.64도
      # zoom 15 이하는 이전 값(기본 셀 0.005도, 배수 15:1,13:2,11:8,9:32,0:128)과 셀 크기가 같다.
      # 주의 1) 셀이 작아 한 사람이 남긴 발자취 하나의 위치도 그대로 보인다(누가 남겼는지는 나오지 않는다, DEC-07).
      # 주의 2) 기본 셀을 더 줄이면 가까이 본 화면이 한 번에 조회할 수 있는 셀 수(백엔드 max-cells 2500)를 넘어 C013 이 난다.
      # 주의 3) 집계 버전을 바꿨으므로 이전 버전(grid-0.005-v1)으로 저장된 탈퇴자 보존분은 합산되지 않는다.
      VISIT_STATS_AGGREGATION_VERSION: grid-0.0001-v1
      VISIT_STATS_BASE_CELL_SIZE_DEGREES: "0.0001"
      VISIT_STATS_ZOOM_MULTIPLIERS: "19:1,18:2,17:5,16:10,15:50,13:100,11:400,9:1600,0:6400"
      VISIT_STATS_MIN_COUNT: "1"
      LOCATION_EVIDENCE_MAX_AGE: 2m
      LOCATION_EVIDENCE_MAX_FUTURE_SKEW: 30s
      LOCATION_POLICY_VERSION: location-v1
      # AR 팁 위치 정확도 기준(미터, 백엔드 #64 AR 팁 API). TBD: 백엔드 로컬 제안값(11/8)을 임시로 넣었다.
      # #64 가 머지되기 전에 서버에 있어야 한다. 그 전에는 백엔드가 이 값을 읽지 않아 넣어 둬도 영향이 없다.
      LOCATION_EVIDENCE_MAX_ACCURACY_METERS: "30"
      # 투어API 공식 코스 적재(백엔드 S15P31A109-221, 일회성). 값은 .env. 비어 있으면 꺼져 있어 아무 일도 하지 않는다.
      # 켜 두면 백엔드가 새로 뜰 때마다(Jenkins 자동 배포 포함) 다시 돈다. 다 돌면 ENABLED=false 로 돌리고 UNPUBLISH·RESEED 를 비운다.
      # 기본값은 백엔드 application.yaml 기본값과 같다. 켜고 끄는 법은 README 9단계 "공식 코스 적재".
      COURSE_SEED_ENABLED: ${COURSE_SEED_ENABLED:-false}
      COURSE_SEED_SOURCE: ${COURSE_SEED_SOURCE:-s3}
      COURSE_SEED_LOCATION: ${COURSE_SEED_LOCATION:-}
      COURSE_SEED_OWNER_USER_ID: ${COURSE_SEED_OWNER_USER_ID:-}
      COURSE_SEED_UNPUBLISH: ${COURSE_SEED_UNPUBLISH:-}
      COURSE_SEED_RESEED: ${COURSE_SEED_RESEED:-}
      # 백엔드에 키가 필요해지면 .env 에 넣고 여기에 한 줄씩 추가한다. 예:
      # TOUR_API_KEY: ${TOUR_API_KEY}
    ports:
      - "127.0.0.1:8080:8080"   # Nginx만 접근

  # 영수증 OCR 서버 (FastAPI + PaddleOCR, CPU). 서버에 따로 받아 둔 ai/dev 코드의 ai/ocr/Dockerfile 로 이미지를 만든다 (가이드 9단계 AI 서버).
  # 앱에서 직접 부르지 않고 백엔드가 내부망(http://ai:8000/ocr/receipt)으로 부르므로 포트를 열지 않는다.
  # ~/yeogirok/ai-src 가 없으면 이 서비스를 빌드하지 못한다. docker compose 명령에 서비스 이름(backend 등)을 붙여 쓰면 영향이 없다.
  ai:
    build: ../../ai-src/ai/ocr
    image: yeogirok-ai:latest
    restart: unless-stopped
    environment:
      OCR_DEVICE: cpu
      TZ: Asia/Seoul
      # 켤 때마다 모델 저장소들에 연결해 보느라 느려지는 것을 끈다. 모델은 처음 켤 때 한 번 받아 볼륨에 둔다.
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - ai-models:/home/app/.paddlex   # OCR 모델(약 100MB)을 배포 때마다 다시 받지 않게 보관
    # 휴대폰 원본 크기 사진(3024x4032) 한 장에 메모리를 7GB 가까이 쓴다(11/9 노트북 시험). 서버 전체가 흔들리지 않게 묶는다.
    # 넘으면 AI 컨테이너만 강제 종료되고 다시 켜진다. 평소(긴 변 2000px 이하 사진)는 2.5GB 이하다.
    mem_limit: 3g
    healthcheck:
      # /health 는 모델을 다 불러온 뒤에 응답한다. 처음 켤 때는 모델을 받느라 1~2분 걸릴 수 있다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  db-data:
  redis-data:
  ai-models:
