# 서버의 /etc/nginx/sites-available/yeogirok 으로 복사해서 쓴다 (가이드 5단계).
# YOUR_DOMAIN 을 실제 도메인으로 바꾼 뒤, certbot 이 이 파일에 HTTPS(443) 설정을 자동으로 덧붙인다.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # 휴대폰 사진·영수증 업로드용. Nginx 기본값은 1MB라 그대로 두면 413 오류가 난다.
    # 백엔드(Spring)의 업로드 한도와 함께 맞춘다.
    client_max_body_size 20m;

    # 채팅 WebSocket (백엔드 API-077, 연결 주소 wss://도메인/ws/v1).
    # Upgrade·Connection 헤더가 없으면 일반 HTTP 요청으로 넘어가 연결이 실패한다.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 앱은 25초마다 PING 을 보내고, 백엔드는 60초 동안 프레임이 없으면 연결을 닫는다. 그보다 길게 둔다.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        # 백엔드가 원래 요청 주소(https, 도메인, 접속자 IP)를 알 수 있게 전달한다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR·AI 일정 생성처럼 오래 걸리는 요청을 기다리는 시간 (기본 60초)
        proxy_read_timeout 120s;
    }
}
