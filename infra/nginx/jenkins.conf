# Jenkins 화면과 웹훅 주소를 https://<도메인>/jenkins/ 로 연다 (가이드 10-2).
#
# 서버의 /etc/nginx/snippets/yeogirok-jenkins.conf 로 복사하고,
# /etc/nginx/sites-available/yeogirok 의 HTTPS(443) server 블록 안에 아래 한 줄을 넣는다.
#   include snippets/yeogirok-jenkins.conf;
# certbot 이 고친 서버 파일을 저장소 yeogirok.conf 로 덮어쓰지 않기 위해 따로 뺐다.
#
# 누가 무엇을 열 수 있나
#   GitHub 웹훅 (/jenkins/generic-webhook-trigger/invoke)  어디서나, POST 만. 주소 끝 토큰이 맞아야 빌드가 돈다
#   Jenkins CLI (/jenkins/cli)                              아무도. 쓰지 않고, 과거 큰 취약점이 이 경로로 들어왔다
#   그 밖의 /jenkins/ 전부 (화면, 로그인, API)              허용 IP 목록에 있는 곳만. 나머지는 403
#
# 왜: Jenkins 는 서버 Docker(docker.sock)를 쓴다. Jenkins 관리자 권한이나 Jenkins 취약점 하나가 곧 서버 root 권한이라
#     로그인 화면을 인터넷 전체에 열어 두지 않는다.
# 허용 IP 목록은 IP 가 공개 저장소에 올라가지 않게 서버에만 둔다: /etc/nginx/snippets/yeogirok-jenkins-allow.conf
# (한 줄에 "allow <IP>;" 하나. 파일이 없으면 nginx -t 가 실패한다. 비워 두면 화면은 SSH 터널로만 열린다)

# /jenkins 로 들어오면 /jenkins/ 로 보낸다. 없으면 백엔드로 넘어가 404 가 난다.
location = /jenkins {
    return 301 /jenkins/;
}

# GitHub 웹훅만 공개한다. GitHub 서버 IP 는 자주 바뀌어 IP 로 막지 않고, 대신 POST 만 받는다.
location = /jenkins/generic-webhook-trigger/invoke {
    limit_except POST {
        deny all;
    }

    proxy_pass http://127.0.0.1:9090;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_read_timeout 30s;
}

location /jenkins/cli {
    deny all;
}

location /jenkins/ {
    # 허용 IP 목록 밖은 403. 목록은 서버에만 있다(위 설명).
    include snippets/yeogirok-jenkins-allow.conf;
    deny all;

    # 주소를 그대로(/jenkins/...) 넘긴다. Jenkins 가 --prefix=/jenkins 로 떠 있어서 맞아떨어진다.
    proxy_pass http://127.0.0.1:9090;

    # Jenkins 가 원래 주소(https, 도메인)를 알아야 화면 링크와 "reverse proxy" 경고가 정상이 된다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    # 빌드 로그를 실시간으로 흘려 보내고, 플러그인 파일 업로드를 막지 않는다.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 100m;
    proxy_read_timeout 90s;
}
