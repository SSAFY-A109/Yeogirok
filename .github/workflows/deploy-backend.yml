# backend/dev 에 머지되면 테스트 → 서버 배포를 자동으로 한다.
#
# 주의: push 로 실행되는 워크플로는 "push 된 브랜치에 들어 있는 파일"을 쓴다.
# 그래서 이 파일은 main 이 아니라 backend/dev 에 들어 있어야 동작한다 (백엔드에 PR로 요청).
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST  서버 도메인 또는 IP
#   SSH_USER  서버 계정 (보통 ubuntu)
#   SSH_KEY   배포 전용 SSH 개인키 전체 내용 (infra 가이드 6단계)

name: deploy-backend

on:
  push:
    branches: [backend/dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: # Actions 탭에서 수동 실행

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 테스트
        run: chmod +x gradlew && ./gradlew --no-daemon test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 서버에서 배포 스크립트 실행
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: bash ~/yeogirok/infra-src/infra/scripts/deploy-backend.sh
